  <rect x="20" y="55" width="8" height="8" rx="2" fill="#5A8FF2"/>
  <rect x="30" y="53" width="10" height="10" rx="2.5" fill="#2F64D6"/>
  <rect x="42" y="47" width="16" height="16" rx="4" fill="#16388A"/>
  <rect x="60" y="53" width="10" height="10" rx="2.5" fill="#2F64D6"/>
  <rect x="72" y="55" width="8" height="8" rx="2" fill="#5A8FF2"/>
  <rect x="48.5" y="64.5" width="3" height="2.5" rx="1.25" fill="#16388A"/>
</svg>
